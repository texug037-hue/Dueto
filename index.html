<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dueto — contas a dois</title>
<meta name="theme-color" content="#12151C">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-32.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-topbar">
      <button id="btnInstall" class="hide">⬇ Baixar app</button>
      <button id="btnBackupLogin">💾 Backup</button>
    </div>
    <div class="login-mid">
      <img src="./icon-192.png" alt="Dueto" class="login-icon">
      <div class="login-logo">Dueto</div>
      <div class="login-tag">contas a dois, visão única</div>

      <div id="stepPhone">
        <div class="login-field-label">Número de celular</div>
        <div class="login-input-wrap">
          <span class="ddi">+55</span>
          <input type="tel" id="loginPhone" placeholder="(19) 99771-1319" maxlength="16">
        </div>
        <div class="login-error" id="loginError"></div>
        <button class="login-btn" id="btnSendCode">Entrar</button>
      </div>
    </div>
    <div class="login-footer">Produzido por <b>Fabrício</b> · <span id="appVersion">v0.8 (teste)</span></div>
  </div>

  <div class="app" id="appRoot" style="display:none;">

    <header>
      <div class="brand-row">
        <div class="brand">Dueto</div>
        <button class="theme-toggle" id="themeToggleBtn">
          <span class="toggle-track" id="toggleTrack"><span class="toggle-thumb"></span></span>
        </button>
      </div>
      <div class="totais-ovais">
        <div class="oval venc"><span class="num" id="totalVencidas">R$ 0</span><span class="lbl">Vencidas</span></div>
        <div class="oval hoje"><span class="num" id="totalHoje">R$ 0</span><span class="lbl">Vence hoje</span></div>
        <div class="oval"><span class="num" id="totalMes">R$ 0</span><span class="lbl">Mês</span></div>
      </div>
    </header>

    <div class="body-layout">
      <nav class="sidebar">
        <button class="active" data-filter="todas">Todos</button>
        <button data-filter="cartao">
          <span class="cat-ico purple">💳</span> Cartões
        </button>
        <button data-filter="agua">
          <span class="cat-ico blue">💧</span> Água
        </button>
        <button data-filter="forca">
          <span class="cat-ico orange">⚡</span> Força
        </button>
        <button data-filter="geral">
          <span class="cat-ico green">🛒</span> Desp. Gerais
        </button>
      </nav>

      <div class="content-area">
        <div class="content-title-row">
          <div class="content-title" id="contentTitle">Todas as contas</div>
          <button class="quick-add" id="quickAddBtn">+</button>
        </div>
        <div id="list"><div class="empty-state">Carregando suas contas...</div></div>
      </div>
    </div>

    <button class="fab" id="fabAdd">+</button>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Nova conta</div>

    <div class="field-label">Categoria</div>
    <div class="seg" id="segCat">
      <button data-cat="cartao">Cartão</button>
      <button data-cat="agua">Água</button>
      <button data-cat="forca">Força</button>
      <button data-cat="geral">Geral</button>
    </div>

    <div id="nomeField">
      <div class="field-label">Nome</div>
      <input type="text" id="f-nome" placeholder="Ex: Cartão Nubank, Mercado...">
    </div>

    <div class="field-label">Valor total (R$)</div>
    <input type="number" step="0.01" id="f-valor" placeholder="0,00">

    <div id="cartaoFields">
      <div class="field-label">Valor mínimo (R$)</div>
      <input type="number" step="0.01" id="f-min" placeholder="0,00">
      <div class="field-label">Parcelamento</div>
      <input type="text" id="f-parcelas" placeholder="Ex: 3/12x ou Sem parcelamento">
    </div>

    <div class="field-label">Vencimento</div>
    <input type="date" id="f-venc">

    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancelSheet">Cancelar</button>
      <button class="btn-save" id="btnSaveSheet">Salvar</button>
    </div>
  </div>

  <input type="file" id="receiptInput" accept="image/*,.pdf" class="hide">

  <script type="module" src="./app.js"></script>
</body>
</html>
